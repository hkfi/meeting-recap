name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        run: scripts/verify-release-version.sh "$GITHUB_REF_NAME"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run tests
        run: make test

      - name: Build
        run: ./build.sh

      - name: Zip app bundle
        run: |
          cd .build
          ditto -c -k --sequesterRsrc --keepParent MeetingRecap.app "MeetingRecap-${{ steps.version.outputs.version }}-macOS.zip"
          shasum -a 256 "MeetingRecap-${{ steps.version.outputs.version }}-macOS.zip" > "MeetingRecap-${{ steps.version.outputs.version }}-macOS.zip.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/MeetingRecap-${{ steps.version.outputs.version }}-macOS.zip
            .build/MeetingRecap-${{ steps.version.outputs.version }}-macOS.zip.sha256
          generate_release_notes: true
          body: |
            Meeting Recap ${{ steps.version.outputs.version }}.

            This release follows the same lightweight distribution pattern as DailyPhotos: the app is ad-hoc signed and packaged with ditto so the macOS app bundle metadata is preserved.

            On first launch, macOS may still ask you to confirm opening an app downloaded from the internet. If needed, right-click MeetingRecap.app and choose Open, or use System Settings > Privacy & Security > Open Anyway.
